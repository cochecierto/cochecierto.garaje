name: Validate PHP

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate PHP syntax
        shell: bash
        run: |
          set -euo pipefail
          find plugins theme -type f -name '*.php' -print0 | while IFS= read -r -d '' file; do
            php -l "$file"
          done

